<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Visualizador de TAGs — Desenhos MCT</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b2e4f">
<style>
  :root{
    --bg:#0b1220; --panel:#111b2e; --panel2:#16223a; --border:#233355;
    --text:#e8edf7; --muted:#94a3c0; --accent:#3aa6ff; --accent2:#22c58b;
    --danger:#ff5d6c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header h1{font-size:16px; margin:0; font-weight:600;}
  header .status{font-size:12px; color:var(--muted);}
  nav{display:flex; gap:6px; padding:8px 10px; background:var(--panel); border-bottom:1px solid var(--border);}
  nav button{
    flex:1; padding:10px 6px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:13px; font-weight:600;
  }
  nav button.active{background:var(--accent); border-color:var(--accent); color:#04121f;}
  main{flex:1; overflow:auto; padding:14px; display:flex; flex-direction:column; gap:14px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px;}
  .card h2{margin:0 0 8px; font-size:14px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .row{display:flex; gap:8px; flex-wrap:wrap;}
  input[type=text], select{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:14px;
  }
  button.btn{
    padding:10px 14px; border-radius:10px; border:1px solid var(--accent);
    background:transparent; color:var(--accent); font-size:14px; font-weight:600;
  }
  button.btn.primary{background:var(--accent); color:#04121f;}
  .muted{color:var(--muted); font-size:12.5px; line-height:1.5;}
  #scanWrap{position:relative; border-radius:12px; overflow:hidden; background:#000;}
  #video{width:100%; display:block; max-height:60vh; object-fit:cover;}
  #scanOverlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  #scanOverlay .box{width:62%; aspect-ratio:1/1; border:3px solid var(--accent2); border-radius:16px; opacity:.85;}
  #viewerBar{display:flex; align-items:center; gap:8px; justify-content:space-between;}
  #viewerBar .tagpill{
    background:var(--panel2); border:1px solid var(--border); border-radius:999px;
    padding:6px 12px; font-size:13px; font-weight:700; color:var(--accent);
  }
  #pageCanvasWrap{
    flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center;
    background:#000; border-radius:12px;
  }
  #pageCanvas{max-width:100%; height:auto; touch-action:pinch-zoom;}
  .pageNav{display:flex; gap:8px; align-items:center; justify-content:center;}
  .pageNav span{font-size:13px; color:var(--muted); min-width:80px; text-align:center;}
  .hidden{display:none !important;}
  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:10px 16px; border-radius:10px; font-size:13px; z-index:50; max-width:90vw; text-align:center;
  }
  #view-viewer{flex:1; display:flex; flex-direction:column; gap:10px;}
  footer{padding:10px 16px; text-align:center;}
  footer a{color:var(--muted); font-size:11px; text-decoration:none;}
</style>
</head>
<body>

<header>
  <h1>📐 Visualizador de TAGs</h1>
  <span class="status" id="statusText">offline pronto</span>
</header>

<nav>
  <button data-view="scan" class="active">📷 Escanear</button>
  <button data-view="viewer">📄 PDF</button>
</nav>

<main>

  <!-- SCAN VIEW -->
  <section id="view-scan">
    <div class="card">
      <h2>Escanear QR code</h2>
      <div id="scanWrap">
        <video id="video" playsinline muted></video>
        <div id="scanOverlay"><div class="box"></div></div>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn primary" id="btnStartScan">Iniciar câmera</button>
        <button class="btn" id="btnStopScan">Parar</button>
      </div>
      <p class="muted">Aponte a câmera para a etiqueta com QR code fixada no tag. Assim que reconhecido, a página exata do desenho é aberta automaticamente.</p>
    </div>

    <div class="card">
      <h2>Ou buscar manualmente</h2>
      <div class="row">
        <select id="docSelect" style="flex:2;"></select>
        <input type="text" id="tagInput" placeholder="Ex: 104P-FM-006" style="flex:2;">
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn primary" id="btnGoTag" style="flex:1;">Abrir tag</button>
      </div>
      <p class="muted" id="noDocsMsg"></p>
    </div>
  </section>

  <!-- VIEWER VIEW -->
  <section id="view-viewer" class="hidden">
    <div id="viewerBar">
      <span class="tagpill" id="viewerTagLabel">—</span>
      <span class="muted" id="viewerDocLabel">—</span>
    </div>
    <div id="pageCanvasWrap">
      <canvas id="pageCanvas"></canvas>
    </div>
    <div class="pageNav">
      <button class="btn" id="btnPrevPage">◀ anterior</button>
      <span id="pageIndicator">— / —</span>
      <button class="btn" id="btnNextPage">próxima ▶</button>
    </div>
    <div class="row" id="otherPagesRow"></div>
  </section>

</main>

<footer><a href="admin.html">área do preparador (importar documentos)</a></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="common.js"></script>
<script src="reader.js"></script>
</body>
</html>
